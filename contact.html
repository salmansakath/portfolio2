<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Salmansakath for freelance web development opportunities, collaborations, or accessibility consulting.">
    <title>Contact - Salmansakath Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="canonical" href="https://www.Salmansakathportfolio.com/contact.html">
    <style>
        .skip-link { position: absolute; top: -40px; left: 0; background: #000; color: white; padding: 8px; z-index: 100; }
        .skip-link:focus { top: 0; }
        
        /* Basic accessible form styling */
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
        input, textarea { width: 100%; max-width: 500px; padding: 0.5rem; }
        input:focus, textarea:focus { outline: 2px solid #005fcc; outline-offset: 2px; }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header role="banner">
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content" role="main">
        <section aria-labelledby="contact-heading">
            <h1 id="contact-heading">Get In Touch</h1>
            <p>Interested in working together? Please fill out the form below.</p>
            
            <!-- Accessible Contact Form -->
            <form action="/submit-endpoint" method="POST" aria-labelledby="contact-heading">
                
                <div class="form-group">
                    <!-- 'for' attribute links label strictly to the input 'id' -->
                    <label for="fullName">Full Name <span aria-hidden="true" title="Required">*</span></label>
                    <input type="text" id="fullName" name="fullName" required aria-required="true" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="emailAddress">Email Address <span aria-hidden="true" title="Required">*</span></label>
                    <input type="email" id="emailAddress" name="emailAddress" required aria-required="true" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="message">Your Message <span aria-hidden="true" title="Required">*</span></label>
                    <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 salmansakath. Built with semantic HTML5.</p>
    </footer>
</body>
</html>
